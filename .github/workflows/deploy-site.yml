name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write # publish to GitHub Pages
  id-token: write # required by actions/deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false # let an in-flight deploy finish instead of cancelling it

env:
  # Served from https://<owner>.github.io/<repo>/, so the site needs both values at build time.
  SITE_URL: https://${{ github.repository_owner }}.github.io
  BASE_PATH: /${{ github.event.repository.name }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs dependencies (the package manager is detected from site/bun.lock),
      # runs `astro build`, and uploads site/dist as the Pages artifact.
      - name: Install, build, and upload the site
        uses: withastro/action@v6
        with:
          path: ./site
          node-version: 24

  deploy:
    name: deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
