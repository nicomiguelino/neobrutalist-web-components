name: Publish

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write # create the GitHub release
  id-token: write # required for npm trusted publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest # trusted publishing needs a GitHub-hosted runner
    steps:
      - uses: actions/checkout@v7

      - name: Validate tag is SemVer
        env:
          TAG: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if ! [[ "$TAG" =~ $semver ]]; then
            echo "::error::Tag '$TAG' is not a valid SemVer tag (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi

      - name: Validate tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg_version=$(jq -r .version package.json)
          if [[ "${TAG#v}" != "$pkg_version" ]]; then
            echo "::error::Tag '$TAG' does not match package.json version '$pkg_version'"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24 # ships npm 11.x; trusted publishing needs npm >= 11.5.1

      - run: npm ci

      # `prepublishOnly` runs the build before publishing.
      # Prereleases (e.g. v0.2.0-beta.1) go to the `next` tag instead of `latest`.
      - name: Publish to npm
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            npm publish --access public --tag next
          else
            npm publish --access public
          fi

      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
